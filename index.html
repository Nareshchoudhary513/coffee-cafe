<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Cafe</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.png">
</head>
<body>

    <header>
        <div class="logo">
            <img class="coffee" src="favicon.png" alt="Coffee Cafe Logo">
            <h1>Coffee Cafe</h1>
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Menu</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h2>Fresh Coffee Everyday</h2>
            <p>Start your day with the best coffee.</p>
            <button>Order Now</button>
        </section>

        <section class="about">
            <h2>About Us</h2>
            <p>We serve fresh and tasty coffee made with love.</p>
        </section>

        <section class="menu">
            <h2>Our Menu</h2>

            <div class="card">
                <h3>Cappuccino</h3>
                <p>₹120</p>
            </div>

            <div class="card">
                <h3>Cold Coffee</h3>
                <p>₹150</p>
            </div>

            <div class="card">
                <h3>Espresso</h3>
                <p>₹100</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Coffee Cafe</p>
    </footer>

</body>
</html>
